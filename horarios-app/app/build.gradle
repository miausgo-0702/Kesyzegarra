plugins { id 'com.android.application' }
// Notificaciones push: se activan cuando está el archivo google-services.json de Firebase
// (Firebase > Configuración del proyecto > Tus apps > Android). Sin él, la app compila igual.
if (file('google-services.json').exists()) { apply plugin: 'com.google.gms.google-services' }
android {
    sourceSets { main { assets.srcDirs = ["../web"] } }
    namespace 'com.kesyzegarra.horarios'
    compileSdk 34
    defaultConfig {
        applicationId 'com.kesyzegarra.horarios'
        minSdk 21
        targetSdk 34
        versionCode 15
        versionName '8.3'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'androidx.core:core:1.13.1'
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}
