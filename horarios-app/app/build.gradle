plugins { id 'com.android.application' }
android {
    namespace 'com.kesyzegarra.horarios'
    compileSdk 34
    defaultConfig {
        applicationId 'com.kesyzegarra.horarios'
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName '2.1'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
